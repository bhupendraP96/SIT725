<!DOCTYPE html>
<html>

<head>





    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/gallery.css">



</head>

<body>
    <header>
        <div class="header">
            <h1> <i class="medium material-icons">camera_alt</i>
                Vupen Photography</h1>
        </div>

    </header>


    <nav>
        <div class="nav-wrapper brown lighten-3">

            <ul id="nav-mobile" class="right nav-style">
                <li><a href="/">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="">Portfolio</a></li>
                <li><a href="">About me</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div>
            <a class="waves-effect waves-grey modal-trigger add-image-btn " type="button" href="#imageFormModal">Add
                Image</a>
        </div>

        <!-- Form Modal for adding images -->
        <div id="imageFormModal" class="modal">
            <div class="modal-content">
                <h4>Image Information</h4>
                <form id="imageForm">
                    <div class="input-field">
                        <input id="title" type="text" name="title" required>
                        <label for="title">Image Title</label>
                    </div>

                    <div class="input-field">
                        <input id="description" type="text" name="description" required>
                        <label for="description">Image Description</label>
                    </div>

                    <div class="input-field">
                        <input id="path" type="text" name="path" required>
                        <label for="path">Image Path (URL)</label>
                    </div>

                    <div class="input-field">
                        <input id="category" type="text" name="category">
                        <label for="category">Image Category</label>
                    </div>

                    <button class="btn waves-effect waves-light" type="submit" name="action">
                        Submit
                        <i class="material-icons right">send</i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Display Images -->
        <div class="row" id="imageList">
        </div>


    </main>


    <footer class="footer-copyright">
        <div class="container">
            © 2014 Copyright Text
            <a class="grey-text text-darken-4 right">Thank you!!</a>
        </div>
    </footer>

    <!--JavaScript at end of body for optimized loading-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>


    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script type="text/javascript" src="js/gallery.js"></script>

</body>

</html>
