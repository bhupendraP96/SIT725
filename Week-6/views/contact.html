<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/contact.css">

</head>

<body>
    <header>
        <div class="header">
            <h1> <i class="medium material-icons">camera_alt</i>
                Vupen Photography</h1>
        </div>

    </header>


    <nav>
        <div class="nav-wrapper brown lighten-3">

            <ul id="nav-mobile" class="right nav-style">
                <li><a href="/">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="">Portfolio</a></li>
                <li><a href="">About me</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="container">
            <h3 class="center-align">Contact Us</h3>
            <div class="row">
                <form id="contactForm" class="col s12">
                    <div class="row">
                        <div class="input-field col s6">
                            <input id="name" type="text" class="validate" required>
                            <label for="name">Full Name</label>
                        </div>
                        <div class="input-field col s6">
                            <input id="email" type="email" class="validate" required>
                            <label for="email">Email</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <textarea id="message" class="materialize-textarea" required></textarea>
                            <label for="message">Message</label>
                        </div>
                    </div>
                    <div class="row">
                        <button class="contact-submit-btn" type="submit">Submit
                            <i class="material-icons right">send</i>
                        </button>
                    </div>
                </form>
                <p id="formResponse" class="center-align green-text"></p>
            </div>
        </div>
    </main>


    <footer class="footer-copyright">
        <div class="container">
            © 2014 Copyright Text
            <a class="grey-text text-darken-4 right">Thank you!!</a>
        </div>
    </footer>

    <!--JavaScript at end of body for optimized loading-->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>


    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script src="/socket.io/socket.io.js"></script>
    <script type="text/javascript" src="js/contact.js"></script>



</body>

</html>
